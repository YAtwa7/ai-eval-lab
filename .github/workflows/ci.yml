name: CI

on:
  pull_request:
  push:
    branches: [main]

# Two jobs. `conventions` is the gate that runs on every change and it
# includes the session-integrity checks, because the session protocol is
# load-bearing in this repo: a handoff that drifts or a session number that
# skips means the next chat starts cold. `evals` is the eval gate and
# activates once the harness lands (evals/requirements.txt exists) - until
# then it reports "no eval layer yet" and passes, because a gate that fires
# on every PR regardless only teaches people to ignore it.
#
# Convention compliance: pinned action tags, explicit least-privilege
# permissions, per-job timeouts, and a ref-keyed concurrency group so
# superseded runs cancel instead of racing.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: repo conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gate (version sync, doc links, secret hygiene, session integrity)
        run: bash scripts/check-conventions.sh
      - name: Progress snapshot
        run: bash scripts/progress.sh
  evals:
    name: eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # actions/upload-artifact needs actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect the eval layer
        id: guard
        run: |
          if [ -f evals/requirements.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "evals/requirements.txt not found - the eval harness has not landed yet; skipping."
          fi

      - name: Set up Python
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install pinned dependencies
        if: steps.guard.outputs.ready == 'true'
        working-directory: evals
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Lint (ruff)
        if: steps.guard.outputs.ready == 'true'
        run: ruff check .

      - name: Eval suite
        if: steps.guard.outputs.ready == 'true'
        run: pytest -q -m "not requires_provider and not requires_target"

      # A failing run must be replayable from the CI page alone: the scorecard
      # this run produced is uploaded on failure.
      - name: Upload the scorecard on failure
        if: steps.guard.outputs.ready == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports
          if-no-files-found: ignore
          retention-days: 14

  # The session gate's own selftest. It proves the session-integrity rules
  # can still fail: one deliberate mutation per rule, each expected to turn
  # the gate red for the stated reason. Without it, "the gate is green" could
  # mean "the gate stopped matching anything" - the exact failure mode that
  # lets a convention rot unnoticed. Runs on every push, on the runner that
  # will do the gating.
  session-selftest:
    name: session gate selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove the session gate can fail
        run: bash scripts/session-selftest.sh
